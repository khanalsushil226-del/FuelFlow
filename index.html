<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Basic Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Page Title -->
    <title>FuelFlow | Login</title>

    <!-- Google Font - Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS Files -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <!-- ==========================
         LOGIN SECTION
    =========================== -->

    <section class="login">

        <!-- Left Side -->
        <div class="login-left">

            <div class="brand">

                <div class="logo">
                    <i class="fa-solid fa-gas-pump"></i>
                </div>

                <h1>FuelFlow</h1>

                <p>Smart Petrol Pump Management System</p>

            </div>

            <div class="welcome-text">

                <h2>
                    Manage your fuel station with confidence.
                </h2>

                <p>
                    Monitor sales, inventory, employees, expenses,
                    and reports—all from one powerful dashboard.
                </p>

            </div>

        </div>

        <!-- Right Side -->
        <div class="login-right">

            <div class="login-card">

                <h2>Welcome Back</h2>

                <p>Please sign in to continue.</p>

                <!-- Login Form -->
                <form id="loginForm">

                    <!-- Username -->
                    <div class="input-group">

                        <label for="username">
                            Username
                        </label>

                        <div class="input-box">

                            <i class="fa-solid fa-user"></i>

                            <input
                                type="text"
                                id="username"
                                name="username"
                                placeholder="Enter your username"
                                autocomplete="username"
                                required>

                        </div>

                    </div>

                    <!-- Password -->
                    <div class="input-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="input-box">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required>

                            <i
                                class="fa-solid fa-eye toggle-password"
                                id="togglePassword">
                            </i>

                        </div>

                    </div>

                    <!-- Login Options -->
                    <div class="login-options">

                        <label for="rememberMe">

                            <input
                                type="checkbox"
                                id="rememberMe">

                            Remember Me

                        </label>

                        <a href="#">
                            Forgot Password?
                        </a>

                    </div>

                    <!-- Login Button -->
                    <button
                        type="submit"
                        class="login-btn"
                        id="loginBtn">

                        Sign In

                    </button>

                </form>

            </div>

        </div>

    </section>

    <!-- JavaScript -->
    <script src="login.js"></script>

</body>

</html>
